<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="title description">
  <title id="title">Emblème Creative Suite</title>
  <desc id="description">Trois rubans lumineux représentant l’audio, le design et l’animation convergent vers une étincelle créative.</desc>
  <defs>
