      <stop offset="1" stop-color="#F6C453"/>
    </linearGradient>
    <linearGradient id="cs-glass" x1="64" y1="42" x2="194" y2="218" gradientUnits="userSpaceOnUse">
      <stop stop-color="#221936"/>
      <stop offset="0.5" stop-color="#101923"/>
      <stop offset="1" stop-color="#10130F"/>
